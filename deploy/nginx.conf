# Install as /etc/nginx/sites-available/task-portal, then:
#   ln -s /etc/nginx/sites-available/task-portal /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d portal.example.com     # rewrites this block for HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name portal.example.com;

    # Attachments are capped at 50 MB each and several can go in one request.
    client_max_body_size 200m;

    # Long enough for large uploads on a slow connection.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
